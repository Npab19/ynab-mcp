services:
  ynab-mcp:
    build: .
    environment:
      - YNAB_API_KEY=${YNAB_API_KEY}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.3.0
    command: tunnel --url http://ynab-mcp:8000 run --token ${Cloudflare_Token}
    depends_on:
      - ynab-mcp
    restart: unless-stopped
    volumes:
      - ./data:/home/nonroot/.cloudflared/
    deploy:
      resources:
        limits:
          cpus: '1'